    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # One alternate icon per paid mascot skin; AppIconManager switches between them.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Sunrise AppIcon-Forest AppIcon-Grape AppIcon-Midnight"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.8"
        CURRENT_PROJECT_VERSION: "30"
        CODE_SIGN_ENTITLEMENTS: HydroDrop/HydroDrop.entitlements
        SKIP_INSTALL: "NO"
        INSTALL_PATH: /Applications
    dependencies:
      - target: HydroDrop Watch App
        embed: true
        copy:
          destination: wrapper
          subpath: Watch
      - target: HydroDropWidgets
        embed: true
      - package: GoogleMobileAds
  # The widget extension compiles a handful of the app's own files rather than taking
  # a dependency on a framework: the set is small, and every one of them is a value
  # type or a pure SwiftUI view with no reference back into the app.
  HydroDropWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HydroDropWidgets
        excludes:
          - "Info.plist"
          - "HydroDropWidgets.entitlements"
      - path: HydroDrop/Shared
      - path: HydroDrop/Intents/LogWaterIntent.swift
      - path: HydroDrop/Intents/GetTodayProgressIntent.swift
      - path: HydroDrop/Models/WaterEntry.swift
      - path: HydroDrop/Models/DrinkType.swift
      - path: HydroDrop/Models/MeasurementSystem.swift
      - path: HydroDrop/Models/MascotSkin.swift
      - path: HydroDrop/Models/DayKey.swift
      - path: HydroDrop/Views/MascotView.swift
      - path: HydroDrop/Support/Diagnostics.swift
      - path: HydroDrop/Models/StreakCalculator.swift
      # `HydroDrop/Shared` opens the store with the full schema, so every model in it
      # has to compile here too, even though no widget draws a bottle.
      - path: HydroDrop/Models/Bottle.swift
    info:
      path: HydroDropWidgets/Info.plist
      properties:
        CFBundleDisplayName: HydroDrop
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDrop.Widgets
        CODE_SIGN_ENTITLEMENTS: HydroDropWidgets/HydroDropWidgets.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.8"
        CURRENT_PROJECT_VERSION: "30"
        SKIP_INSTALL: "YES"

  HydroDrop Watch App:
    type: application
    platform: watchOS
    sources:
      - path: HydroDrop Watch App
      - path: HydroDrop/Views/MascotView.swift
      - path: HydroDrop/StoreKit/StoreManager.swift
      - path: HydroDrop/Models/MeasurementSystem.swift
      - path: HydroDrop/Models/MascotSkin.swift
      - path: HydroDrop/Models/DayKey.swift
      - path: HydroDrop/StoreKit/EntitlementCache.swift
    info:
      path: HydroDrop Watch App/Info.plist
      properties:
        CFBundleDisplayName: HydroDrop
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jonathonbrown.HydroDrop
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDrop.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.8"
        CURRENT_PROJECT_VERSION: "30"
        SKIP_INSTALL: "YES"
  HydroDropTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HydroDropTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDropTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HydroDrop.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HydroDrop"
        SKIP_INSTALL: "YES"
    dependencies:
      - target: HydroDrop
  HydroDropScreenshotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HydroDropScreenshotUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDropScreenshotUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HydroDrop
        SKIP_INSTALL: "YES"
    dependencies:
      - target: HydroDrop
schemes:
  HydroDrop:
    build:
      targets:
        HydroDrop: all
        HydroDropTests: [test]
        HydroDropScreenshotUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: HydroDrop/StoreKit/Products.storekit
    test:
      config: Debug
      # The test action also needs the StoreKit configuration, but XcodeGen 2.46.0
      # only emits `storeKitConfiguration` for the run action and silently drops it
      # here. Scripts/patch_scheme_storekit.py injects it after generation.
      targets:
        - HydroDropTests
        - HydroDropScreenshotUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  HydroDrop Watch App:
    build:
      targets:
        HydroDrop Watch App: all
    run:
      config: Debug
      storeKitConfiguration: HydroDrop/StoreKit/Products.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
