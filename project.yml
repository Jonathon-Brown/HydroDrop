name: HydroDrop
options:
  bundleIdPrefix: com.jonathonbrown
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "YR8YP5788W"
    CODE_SIGN_STYLE: Automatic
fileGroups:
  - HydroDrop/StoreKit
targets:
  HydroDrop:
    type: application
    platform: iOS
    sources:
      - path: HydroDrop
        excludes:
          - "StoreKit/Products.storekit"
    info:
      path: HydroDrop/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserNotificationsUsageDescription: "HydroDrop reminds you to drink water throughout the day."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_ENTITLEMENTS: HydroDrop/HydroDrop.entitlements
    dependencies:
      - target: HydroDrop Watch App
  HydroDrop Watch App:
    type: application
    platform: watchOS
    sources:
      - path: HydroDrop Watch App
      - path: HydroDrop/Views/MascotView.swift
      - path: HydroDrop/StoreKit/StoreManager.swift
      - path: HydroDrop/Models/MeasurementSystem.swift
    info:
      path: HydroDrop Watch App/Info.plist
      properties:
        CFBundleDisplayName: HydroDrop
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jonathonbrown.HydroDrop
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDrop.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SKIP_INSTALL: NO
  HydroDropScreenshotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HydroDropScreenshotUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDropScreenshotUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HydroDrop
    dependencies:
      - target: HydroDrop
schemes:
  HydroDrop:
    build:
      targets:
        HydroDrop: all
        HydroDrop Watch App: all
        HydroDropScreenshotUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: HydroDrop/StoreKit/Products.storekit
    test:
      config: Debug
      targets:
        - HydroDropScreenshotUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  HydroDrop Watch App:
    build:
      targets:
        HydroDrop Watch App: all
    run:
      config: Debug
      storeKitConfiguration: HydroDrop/StoreKit/Products.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
