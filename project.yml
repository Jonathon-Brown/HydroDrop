name: HydroDrop
options:
  bundleIdPrefix: com.jonathonbrown
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
# Whether Duo Streaks v2 is compiled in. Both files leave DUO_V2_CONDITION empty, so it is not.
# Debug (Xcode's Run and Test) also reads an optional, gitignored `Config/Duo.local.xcconfig`;
# Release reads no local file, so nothing left in a worktree can put Duo into an archive. A build
# setting on the command line (`DUO_V2_CONDITION=DUO_V2`) turns it on, in either configuration,
# for the app, the widgets and the unit tests (the Watch app and the UI tests hold no Duo code
# and ignore it), and that is how a release that ships Duo says so. Every Duo source file is
# wrapped in `#if DUO_V2`.
configFiles:
  Debug: Config/Duo.xcconfig
  Release: Config/Duo.Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "YR8YP5788W"
    CODE_SIGN_STYLE: Automatic
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
  # The rules the app, the widgets, the Watch app, the Duo server and the Android app all
  # have to agree on. A local package, so it has no entry in Dependencies/Package.resolved.
  HydroCore:
    path: HydroCore
fileGroups:
  - HydroDrop/StoreKit
targets:
  HydroDrop:
    type: application
    platform: iOS
    sources:
      - path: HydroDrop
        excludes:
          - "StoreKit/Products.storekit"
    info:
      path: HydroDrop/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # HydroDrop uses no encryption beyond what Apple exempts, so answering here
        # keeps every upload out of App Store Connect's "Missing Compliance" state.
        ITSAppUsesNonExemptEncryption: false
        # CloudKit delivers SwiftData sync via silent pushes.
        UIBackgroundModes:
          - remote-notification
          # Background app refresh. For now it only backs an empty handler for the retired
          # iCloud Duo's refresh, which a TestFlight tester's phone may still have
          # scheduled; a launch for it with no handler is a crash (see LegacyDuoCleanup).
          # Keep this and the identifier below: the Duo redesign is to take the identifier
          # over for its own background fetch rather than retire it.
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).duo.refresh"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserNotificationsUsageDescription: "HydroDrop reminds you to drink water throughout the day."
        NSHealthUpdateUsageDescription: "HydroDrop adds the drinks you log to Apple Health as dietary water, and their caffeine if you track it, and removes them again if you delete them. This is off until you turn it on."
        NSHealthShareUsageDescription: "HydroDrop reads your sleep, resting heart rate, workouts, and active energy, only when you turn on Insights, to show you patterns in your own data and to suggest extra water on days you work out."
        NSLocationWhenInUseUsageDescription: "HydroDrop checks the weather where you are so it can suggest extra water on hot days. Your location is only used for that, and never leaves your device except to ask Apple for the forecast."
        NFCReaderUsageDescription: "HydroDrop reads the NFC sticker on your bottle so one tap logs a full bottle, and writes to a sticker when you set one up."
        NSSupportsLiveActivities: true
        GADApplicationIdentifier: "ca-app-pub-5814718978331211~3407720909" # HydroDrop's AdMob App ID
        # Without this, Google's ad SDK sets itself up at every launch on its own (its
        # settings, its on-device storage, a crash reporter), before and whether or not
        # the app ever starts it. In the EEA, the UK and Switzerland the app never does
        # (see AdRegion), and the privacy page says Google's ad software isn't started
        # there. The key is not in Google's public docs: re-check it on every
        # GoogleMobileAds update (a fresh install with -AdRegion GBR must leave no
        # Library/Application Support/GoogleMobileAds folder).
        GADDelayInitialization: true
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: k674qkevps.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: klf5c3l5u5.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: kbmxgpxpgc.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(DUO_V2_CONDITION)"
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # One alternate icon per paid mascot skin; AppIconManager switches between them.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Sunrise AppIcon-Forest AppIcon-Grape AppIcon-Midnight"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.8.1"
        CURRENT_PROJECT_VERSION: "34"
        # HydroDrop/HydroDrop.entitlements, from Config/Duo.xcconfig and Config/Duo.Release.xcconfig,
        # unless a build that compiles Duo in sets HydroDrop/HydroDrop.duo.entitlements, which adds
        # App Attest. The plain file stays free of a capability the provisioning profile may not
        # carry yet, so a release without Duo signs exactly as before.
        CODE_SIGN_ENTITLEMENTS: "$(DUO_ENTITLEMENTS)"
        # The privacy manifest and the camera's purpose string follow DUO_V2_CONDITION, the switch
        # that already selects the code, so a build with Duo off bundles exactly what main does
        # (decision D77). Both manifests are in the app's sources and one is left out: main's
        # HydroDrop/PrivacyInfo.xcprivacy without Duo, the six types of HydroDrop/Duo/ with it.
        # The camera string is not in info.properties, which would put it in the tracked
        # HydroDrop/Info.plist of every build; it is merged in only when GENERATE_INFOPLIST_FILE is
        # YES, which only a Duo build sets (with NO, Xcode processes Info.plist exactly as on main
        # and ignores INFOPLIST_KEY_ settings). Duo's push words, HydroDrop/Resources/en.lproj/
        # Localizable.strings, are left out the same way: without Duo the app would otherwise gain
        # an en.lproj folder main's has not, and the App Intents metadata would move into it. The
        # file is named, not given a path, because it sits in a variant group, which a path
        # pattern does not reach. At P7, when Duo is on by default, the plain manifest and these
        # selection settings are deleted.
        EXCLUDED_SOURCE_FILE_NAMES: "$(DUO_EXCLUDED_MANIFEST_$(DUO_V2_CONDITION))"
        DUO_EXCLUDED_MANIFEST_: "*/HydroDrop/Duo/PrivacyInfo.xcprivacy Localizable.strings"
        DUO_EXCLUDED_MANIFEST_DUO_V2: "*/HydroDrop/PrivacyInfo.xcprivacy"
        GENERATE_INFOPLIST_FILE: "$(DUO_INFOPLIST_KEYS_$(DUO_V2_CONDITION))"
        DUO_INFOPLIST_KEYS_: "NO"
        DUO_INFOPLIST_KEYS_DUO_V2: "YES"
        # Duo Streaks' in-app QR scanner, which iOS asks about when the person taps Scan.
        INFOPLIST_KEY_NSCameraUsageDescription: "HydroDrop uses the camera only to scan a duo invite's QR code. The picture is never saved or sent."
        SKIP_INSTALL: "NO"
        INSTALL_PATH: /Applications
    dependencies:
      - target: HydroDrop Watch App
        embed: true
        copy:
          destination: wrapper
          subpath: Watch
      - target: HydroDropWidgets
        embed: true
      - package: GoogleMobileAds
      - package: HydroCore
  # The widget extension compiles a handful of the app's own files rather than taking
  # a dependency on a framework: the set is small, and every one of them is a value
  # type or a pure SwiftUI view with no reference back into the app.
  HydroDropWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HydroDropWidgets
        excludes:
          - "Info.plist"
          - "HydroDropWidgets.entitlements"
      - path: HydroDrop/Shared
      - path: HydroDrop/Intents/LogWaterIntent.swift
      - path: HydroDrop/Intents/GetTodayProgressIntent.swift
      - path: HydroDrop/Models/WaterEntry.swift
      - path: HydroDrop/Models/DrinkType.swift
      - path: HydroDrop/Models/MeasurementSystem.swift
      - path: HydroDrop/Models/MascotSkin.swift
      - path: HydroDrop/Views/MascotView.swift
      - path: HydroDrop/Support/Diagnostics.swift
      - path: HydroDrop/Models/StreakCalculator.swift
      # `HydroDrop/Shared` opens the store with the full schema, so every model in it
      # has to compile here too, even though no widget draws a bottle.
      - path: HydroDrop/Models/Bottle.swift
    info:
      path: HydroDropWidgets/Info.plist
      properties:
        CFBundleDisplayName: HydroDrop
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(DUO_V2_CONDITION)"
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDrop.Widgets
        CODE_SIGN_ENTITLEMENTS: HydroDropWidgets/HydroDropWidgets.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.8.1"
        CURRENT_PROJECT_VERSION: "34"
        SKIP_INSTALL: "YES"
    dependencies:
      - package: HydroCore

  HydroDrop Watch App:
    type: application
    platform: watchOS
    sources:
      - path: HydroDrop Watch App
      - path: HydroDrop/Views/MascotView.swift
      - path: HydroDrop/StoreKit/StoreManager.swift
      - path: HydroDrop/Models/MeasurementSystem.swift
      - path: HydroDrop/Models/MascotSkin.swift
      - path: HydroDrop/Shared/HydroCoreImport.swift
      - path: HydroDrop/StoreKit/EntitlementCache.swift
      # Duo Streaks' push words. The server sends only keys (`duo.nudge.title`), and a push the
      # iPhone forwards to a paired Watch is worded there, from the Watch app's own bundle, which
      # otherwise has no strings file and would show the raw key. The folder, not the file: named
      # directly, XcodeGen 2.46 gives the file to the app alone once it exists, and before it
      # exists leaves the Watch target pointing at a missing file. Optional, because the folder
      # arrives with Duo's notifications; `includes` keeps anything else in it out of the Watch.
      - path: HydroDrop/Resources
        optional: true
        includes:
          - "*.lproj/Localizable.strings"
    info:
      path: HydroDrop Watch App/Info.plist
      properties:
        CFBundleDisplayName: HydroDrop
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jonathonbrown.HydroDrop
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDrop.watchkitapp
        # The push words from HydroDrop/Resources (the source above) follow DUO_V2_CONDITION as the
        # app's do, so a Watch app built without Duo has no strings file, as main's has none
        # (decision D77). With Duo the setting is empty and the file stays.
        EXCLUDED_SOURCE_FILE_NAMES: "$(DUO_EXCLUDED_STRINGS_$(DUO_V2_CONDITION))"
        DUO_EXCLUDED_STRINGS_: "Localizable.strings"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.8.1"
        CURRENT_PROJECT_VERSION: "34"
        SKIP_INSTALL: "YES"
    dependencies:
      - package: HydroCore

  HydroDropTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HydroDropTests
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(DUO_V2_CONDITION)"
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDropTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HydroDrop.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HydroDrop"
        SKIP_INSTALL: "YES"
    dependencies:
      - target: HydroDrop
  HydroDropScreenshotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HydroDropScreenshotUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDropScreenshotUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HydroDrop
        SKIP_INSTALL: "YES"
    dependencies:
      - target: HydroDrop
schemes:
  HydroDrop:
    build:
      targets:
        HydroDrop: all
        HydroDropTests: [test]
        HydroDropScreenshotUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: HydroDrop/StoreKit/Products.storekit
    test:
      config: Debug
      # The test action also needs the StoreKit configuration, but XcodeGen 2.46.0
      # only emits `storeKitConfiguration` for the run action and silently drops it
      # here. Scripts/patch_scheme_storekit.py injects it after generation.
      targets:
        - HydroDropTests
        - HydroDropScreenshotUITests
        - package: HydroCore/HydroCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  HydroDrop Watch App:
    build:
      targets:
        HydroDrop Watch App: all
    run:
      config: Debug
      storeKitConfiguration: HydroDrop/StoreKit/Products.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
