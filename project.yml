name: HydroDrop
options:
  bundleIdPrefix: com.jonathonbrown
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "YR8YP5788W"
    CODE_SIGN_STYLE: Automatic
fileGroups:
  - HydroDrop/StoreKit
targets:
  HydroDrop:
    type: application
    platform: iOS
    sources:
      - path: HydroDrop
        excludes:
          - "StoreKit/Products.storekit"
    info:
      path: HydroDrop/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserNotificationsUsageDescription: "HydroDrop reminds you to drink water throughout the day."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathonbrown.HydroDrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
schemes:
  HydroDrop:
    build:
      targets:
        HydroDrop: all
    run:
      config: Debug
      storeKitConfiguration: HydroDrop/StoreKit/Products.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
